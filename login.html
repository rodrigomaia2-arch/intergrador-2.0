        <span class="account-badge" id="accountBadge"></span>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">👁️</button>
        </div>
      </div>

      <div class="login-row">
        <label class="checkbox-label"><input type="checkbox" id="remember"> Lembrar-me</label>
        <a href="#" class="forgot-link" id="forgotLink">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn-primary btn-block">Entrar</button>
    </form>

    <p class="login-hint">Acesso de teste: <strong>admin@ypora.com</strong> / <strong>admin123</strong> para o painel administrativo. Qualquer outro email e senha válidos entram como usuário comum.</p>
  </main>

<script src="login.js"></script>
</body>
</html>
